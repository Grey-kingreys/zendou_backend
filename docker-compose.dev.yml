services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: zendou
      POSTGRES_PASSWORD: zendou
      POSTGRES_DB: zendou
    volumes:
      - zendou_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  zendou_postgres_data:
